<style>
:root{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:6.5rem;background:#f8fafc;color:#0f172a;-webkit-text-size-adjust:100%}
body{overflow-x:clip;padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px))}
@media(min-width:768px){body{padding-bottom:0}}
.bg-mesh-soft{background-image:radial-gradient(at 0% 0%,rgba(204,251,241,.5) 0,transparent 50%),radial-gradient(at 100% 0%,rgba(224,242,254,.6) 0,transparent 50%),radial-gradient(at 50% 100%,rgba(240,253,250,.8) 0,transparent 50%)}
.glass-nav{background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(226,232,240,.8);padding-top:env(safe-area-inset-top,0px)}
.dock{bottom:max(.75rem,env(safe-area-inset-bottom,0px))}
summary{list-style:none}summary::-webkit-details-marker{display:none}
.faq-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.4,0,.2,1)}
.faq-inner{overflow:hidden;min-height:0;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .4s}
.faq-item.open .faq-panel{grid-template-rows:1fr}
.faq-item.open .faq-inner{opacity:1;visibility:visible}
.faq-icon{transition:transform .35s cubic-bezier(.4,0,.2,1)}
.faq-item.open .faq-icon{transform:rotate(180deg)}
.faq-item{transition:border-color .3s,box-shadow .3s}
.faq-item.open{border-color:#5eead4}

input,select{font-size:16px}
@keyframes subtleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.animate-gentle{animation:subtleFloat 5s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.animate-gentle,.animate-pulse{animation:none}*{transition:none!important}}
/* Tamil navbar: labels are wide, so use the menu button until 1536px */
html[lang="ta"] #deskNav{display:none!important}
html[lang="ta"] #menuBtn{display:flex!important}
@media(min-width:1280px) and (max-width:1535px){html[lang="ta"] #mobileMenu:not(.hidden){display:block!important}}
@media(min-width:1536px){html[lang="ta"] #deskNav{display:flex!important;gap:1.25rem}html[lang="ta"] #menuBtn,html[lang="ta"] #mobileMenu{display:none!important}}
html[lang="ta"] #deskNav a{font-size:.8125rem!important}
html[lang="ta"] header .max-w-7xl{max-width:90rem}
html[lang="ta"] h1,html[lang="ta"] h2,html[lang="ta"] h3{line-height:1.45}
html[lang="ta"] p,html[lang="ta"] li{line-height:1.75}
html[lang="ta"] h1{font-size:1.5rem!important}
html[lang="ta"] h2{font-size:1.25rem!important}
html[lang="ta"] h3{font-size:1rem!important}
html[lang="ta"] .text-base{font-size:.9375rem!important}
html[lang="ta"] .text-sm{font-size:.8125rem!important}
html[lang="ta"] .text-xs{font-size:.75rem!important}
html[lang="ta"] .text-lg,html[lang="ta"] .text-xl{font-size:1rem!important}
html[lang="ta"] .text-\[11px\],html[lang="ta"] .text-\[10px\]{font-size:.6875rem!important}
@media(min-width:640px){
html[lang="ta"] h1{font-size:2.125rem!important}
html[lang="ta"] h2{font-size:1.625rem!important}
html[lang="ta"] h3{font-size:1.125rem!important}
html[lang="ta"] .sm\:text-base{font-size:.9375rem!important}
html[lang="ta"] .sm\:text-lg,html[lang="ta"] .sm\:text-xl{font-size:1.0625rem!important}
html[lang="ta"] .sm\:text-sm{font-size:.8125rem!important}
}
@media(min-width:1024px){
html[lang="ta"] h1{font-size:2.5rem!important}
html[lang="ta"] h2{font-size:1.875rem!important}
}
html[lang="ta"] h1 span.bg-clip-text{padding-bottom:.15em;display:inline-block}
h1,h2,h3,p,span,a{overflow-wrap:break-word}

$("#clinicGrid").innerHTML=CL.map(c=>`<div class="bg-slate-50 border border-slate-200 rounded-3xl p-6 sm:p-8 shadow-sm hover:shadow-card hover:border-brand-300 transition-all flex flex-col justify-between"><div class="space-y-4"><div class="flex items-center justify-between gap-2"><span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-100 text-brand-800 text-xs font-bold"><span class="w-2 h-2 rounded-full bg-emerald-500"></span><span ${i("branchStatus")}></span></span><span class="text-xs font-bold text-slate-400">${c[4]}</span></div><h3 class="text-xl sm:text-2xl font-bold text-slate-900" ${i(c[0]+"Name")}></h3><div class="space-y-3 pt-2 text-sm text-slate-600"><div class="flex items-start gap-3"><i class="ph-bold ph-map-pin text-brand-600 text-lg flex-shrink-0 mt-0.5"></i><span ${i(c[0]+"Address")}></span></div><div class="flex items-start gap-3"><i class="ph-bold ph-clock text-brand-600 text-lg flex-shrink-0 mt-0.5"></i><span ${i("cHours")}></span></div><div class="flex items-center gap-3"><i class="ph-bold ph-phone text-brand-600 text-lg flex-shrink-0"></i><a href="tel:+${PHONE}" class="font-medium hover:text-brand-600 py-1">+91 99451 49151</a></div></div></div><div class="mt-8 pt-6 border-t border-slate-200 flex flex-col sm:flex-row gap-3"><a href="${c[2]}" target="_blank" rel="noopener" class="flex-1 inline-flex items-center justify-center gap-2 px-5 py-3 bg-white hover:bg-slate-100 text-slate-800 font-bold text-sm rounded-xl border border-slate-200 shadow-sm text-center"><i class="ph-bold ph-navigation-arrow text-brand-600 text-base"></i><span ${i("getDirections")}></span></a><a href="#book" data-branch="${c[1]}" class="flex-1 inline-flex items-center justify-center px-5 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold text-sm rounded-xl shadow-sm text-center" ${i(c[3])}></a></div></div>`).join("");

$("#quals").innerHTML=[1,2,3].map(n=>`<div class="p-3.5 bg-slate-50 rounded-2xl border border-slate-100"><div class="text-xs text-slate-500 font-medium" ${i("qual"+n+"Label")}></div><div class="text-sm font-extrabold text-slate-900" ${i("qual"+n+"Val")}></div></div>`).join("");

$("#faqList").innerHTML=[1,2,3,4,5,6].map(n=>`<div class="faq-item bg-white border border-slate-200 rounded-2xl shadow-sm"><button type="button" id="faqB${n}" aria-expanded="false" aria-controls="faqP${n}" class="faq-btn w-full flex items-center justify-between gap-3 text-left p-5 sm:p-6 font-bold text-slate-900 text-base sm:text-lg rounded-2xl focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"><span ${i("faqQ"+n)}></span><span class="faq-icon flex-shrink-0 text-brand-600"><i class="ph-bold ph-caret-down text-xl"></i></span></button><div id="faqP${n}" role="region" aria-labelledby="faqB${n}" class="faq-panel"><div class="faq-inner"><p class="mx-5 sm:mx-6 mb-5 sm:mb-6 pt-4 text-sm text-slate-600 leading-relaxed border-t border-slate-100" ${i("faqA"+n)}></p></div></div></div>`).join("");
$("#faqList").addEventListener("click",e=>{
const btn=e.target.closest(".faq-btn");if(!btn)return;
const item=btn.closest(".faq-item"),open=!item.classList.contains("open");
document.querySelectorAll("#faqList .faq-item.open").forEach(x=>{x.classList.remove("open");x.querySelector(".faq-btn").setAttribute("aria-expanded","false")});
if(open){item.classList.add("open");btn.setAttribute("aria-expanded","true")}
});

let lang="en";
function setLang(l){
lang=l;const d=T[l];
document.querySelectorAll("[data-i18n]").forEach(el=>{const v=d[el.dataset.i18n]??T.en[el.dataset.i18n];if(v!==undefined)el.innerHTML=v;});
$("#patientName").placeholder=d.placeholderName;$("#patientPhone").placeholder=d.placeholderPhone;$("#prefTime").placeholder=d.placeholderTime;
$("#langLabel").textContent=l==="en"?"தமிழ்":"English";
document.documentElement.lang=l;document.body.classList.toggle("font-tamil",l==="ta");
try{localStorage.setItem("lang",l)}catch(e){}
}
$("#langToggleBtn").addEventListener("click",()=>setLang(lang==="en"?"ta":"en"));

const menu=$("#mobileMenu"),mb=$("#menuBtn");
function closeMenu(){menu.classList.add("hidden");mb.setAttribute("aria-expanded","false");mb.innerHTML='<i class="ph-bold ph-list text-xl"></i>'}
mb.addEventListener("click",()=>{const o=menu.classList.toggle("hidden")===false;mb.setAttribute("aria-expanded",String(o));mb.innerHTML=`<i class="ph-bold ph-${o?"x":"list"} text-xl"></i>`});
menu.addEventListener("click",e=>{if(e.target.closest("a"))closeMenu()});
matchMedia("(min-width:1280px)").addEventListener("change",e=>{if(e.matches)closeMenu()});

document.addEventListener("click",e=>{
const a=e.target.closest("a[data-branch],a[data-reason]");if(!a)return;
if(a.dataset.branch)$("#clinicBranch").value=a.dataset.branch;
if(a.dataset.reason)$("#treatmentReason").value=a.dataset.reason;
});

$("#appointmentForm").addEventListener("submit",e=>{
e.preventDefault();
const d=T[lang]||T.en,v=id=>$(id).value.trim(),time=v("#prefTime");
let m=`${d.waHello}\n\n${d.waName}: ${v("#patientName")}\n${d.waPhone}: ${v("#patientPhone")}\n${d.waClinic}: ${$("#clinicBranch").value}\n${d.waReason}: ${$("#treatmentReason").value}`;
if(time)m+=`\n${d.waTime}: ${time}`;
m+=`\n\n${d.waBye}`;
const url=`https://wa.me/${PHONE}?text=${encodeURIComponent(m)}`;
const txt=$("#submitBtnText");txt.textContent=d.formOpening;
const w=window.open(url,"_blank");if(!w)location.href=url;
setTimeout(()=>{txt.textContent=T[lang].formSubmit},1500);
});

let saved="en";try{saved=localStorage.getItem("lang")||"en"}catch(e){}
setLang(saved==="ta"?"ta":"en");
})();
</script>
</body>
</html>
